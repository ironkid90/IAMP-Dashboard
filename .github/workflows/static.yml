# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        env:
          CARTO_PUBLIC_BASEMAP_KEY: ${{ vars.CARTO_PUBLIC_BASEMAP_KEY }}
          CARTO_KEY_PUBLIC_CONFIRMED: ${{ vars.CARTO_KEY_PUBLIC_CONFIRMED }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import shutil
          from pathlib import Path

          key = os.environ.get("CARTO_PUBLIC_BASEMAP_KEY", "").strip()
          if not key:
              raise SystemExit("Set CARTO_PUBLIC_BASEMAP_KEY as an Actions variable containing only a deliberately public browser token.")
          if os.environ.get("CARTO_KEY_PUBLIC_CONFIRMED", "").strip().lower() != "yes":
              raise SystemExit(
                  "Refusing to publish CARTO_PUBLIC_BASEMAP_KEY: it becomes public in served HTML. "
                  "In CARTO, restrict this key to the deployed GitHub Pages origin and "
                  "basemap-only access, then set the repository variable "
                  "CARTO_KEY_PUBLIC_CONFIRMED=yes to confirm it is safe to publish."
              )
          output = Path("_site")
          output.mkdir(exist_ok=True)
          shutil.copy2("index.html", output / "index.html")
          shutil.copytree("hand_sharepoint_dashboard", output / "hand_sharepoint_dashboard", dirs_exist_ok=True)
          entry = output / "hand_sharepoint_dashboard/index.html"
          marker = '<meta name="carto-api-key" content="" />'
          content = entry.read_text()
          if content.count(marker) != 1:
              raise SystemExit("Expected exactly one CARTO configuration placeholder.")
          entry.write_text(content.replace(marker, '<meta name="carto-api-key" content="' + html.escape(key, quote=True) + '" />'))
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
