# Netlify configuration for IAMP Dashboard

[build]
  command = "python3 tools/build_public_site.py"
  publish = "_site"

[build.environment]
  CARTO_PUBLIC_BASEMAP_KEY = "cb1_3o1s_1_928823fbaca6c714134db44d"
  CARTO_KEY_PUBLIC_CONFIRMED = "yes"

# Redirect root to the dashboard
[[redirects]]
  from = "/"
  to = "/hand_sharepoint_dashboard/"
  status = 302

[[headers]]
  for = "/hand_sharepoint_dashboard/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hand_sharepoint_dashboard/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hand_sharepoint_dashboard/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# TopoJSON/JSON data – cache for 1 hour, allow revalidation
[[headers]]
  for = "/hand_sharepoint_dashboard/assets/data/*.topojson"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/hand_sharepoint_dashboard/assets/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# HTML – short cache with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hand_sharepoint_dashboard/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
